
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show the SDK in use
        shell: pwsh
        run: dotnet --version

      - name: Build
        shell: pwsh
        run: dotnet build Bbu.slnx -m:1

      - name: Test (default tier)
        shell: pwsh
        run: dotnet test Bbu.slnx -m:1
