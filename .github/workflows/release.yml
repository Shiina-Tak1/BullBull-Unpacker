
name: release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest

    if: github.event_name == 'workflow_dispatch' || github.repository != 'Shiina-Tak1/BullBull-Unpacker-CS'

    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'utf-8'

    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $props = Get-Content -Raw Directory.Build.props
          $prefix = [regex]::Match($props, '<VersionPrefix>(?<v>[0-9]+\.[0-9]+\.[0-9]+)</VersionPrefix>').Groups['v'].Value
          if (-not $prefix) { throw '读不到 VersionPrefix：Directory.Build.props 是版本号的唯一出处' }
          if ($prefix -ne '${{ github.ref_name }}') {
            throw "tag '${{ github.ref_name }}' 与 VersionPrefix '$prefix' 不一致"
          }
          Write-Host "版本一致：$prefix"

      - name: Check the AOT toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "找不到 vswhere.exe，无法确认 MSVC 链接器；AOT 会停在 Platform linker not found"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "runner 上没有 MSVC C++ 工具集；AOT 会停在 Platform linker not found"
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          if (-not (Test-Path $sdkRoot)) {
            throw "runner 上没有 Windows SDK（$sdkRoot）；AOT 会停在 Platform linker not found"
          }
          Write-Host "MSVC：$vs"
          Write-Host "Windows SDK：$((Get-ChildItem $sdkRoot -Directory | Sort-Object Name | Select-Object -Last 1).Name)"

      - name: Build the AOT portable package
        shell: pwsh
        run: python packaging\pack_release.py --flavor aot

      - name: List what was produced
        shell: pwsh
        run: Get-ChildItem .scratch\release -File | Select-Object Name, Length

      - name: Upload the portable package
        uses: actions/upload-artifact@v7
        with:
          name: BullBullUnpacker-aot
          path: |
            .scratch/release/*win-x64-portable.zip
            .scratch/release/*win-x64-portable.zip.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.ref_name }}'
          $zip = @(Get-ChildItem .scratch\release -Filter 'BullBullUnpacker-*-win-x64-portable.zip')
          if ($zip.Count -ne 1) { throw "期望一个便携包 zip，实际 $($zip.Count) 个" }
          $sum = "$($zip[0].FullName).sha256"
          if (-not (Test-Path $sum)) { throw "没找到 $($zip[0].Name) 的校验文件" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "便携版：64 位 Windows 10 版本 1607（build 14393）及以上。待补：这一版的变化由作者手写。附件是 win-x64 便携包与它的 SHA-256 校验文件。" --draft --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Release $tag 建不出来" }
          }
          gh release upload $tag $zip[0].FullName $sum --clobber
          if ($LASTEXITCODE -ne 0) { throw "附件传不上去" }
          Write-Host "已发布 $tag：$($zip[0].Name) 与它的校验文件"
